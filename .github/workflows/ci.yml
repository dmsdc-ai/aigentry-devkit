name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate CLI
        run: node bin/aigentry-devkit.js --help

      # Telepty install-version policy (#1213): pure decide() rows, then the real
      # callers (install.sh on POSIX, install.ps1 via pwsh + powershell.exe on
      # Windows, aigentry-devkit setup/update) with inert fake npm/telepty/curl.
      # On Node 18 the caller rows assert the telepty engine refusal.
      - name: Telepty version policy tests
        run: node --test tests/telepty-version-policy.test.js tests/install-telepty-version.test.js
